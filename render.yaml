# Render blueprint for Gita Counsel.
#
# THIS IS THE FREE CONFIGURATION. It deploys on Render's free plan with no
# payment, and everything that does not need an AI model works:
#
#   works   /study (all 701 verses, 3 locales), the Hungarian review queue,
#           /admin, bookmarks, reading progress, verse of the day, sign-in
#   off     /search and /chat — see EMBED_BACKEND below
#
# WHY THEY ARE OFF. The encoder holds ~1.3GB of weights in the process and the
# free plan gives 512MB. Loading it would not fail the request, it would
# OOM-kill the process and take /study down with it — so one person opening
# /search would fell the whole site. `EMBED_BACKEND=disabled` refuses before
# the model is touched, and says so plainly.
#
# TO TURN SEARCH AND COUNSEL ON (this is the part that costs money):
#   1. plan: standard          below — 2GB, enough to hold the encoder
#   2. uncomment the `disk:`   block — 5GB, or the 1.3GB of weights are
#                                      re-downloaded on every cold start
#   3. EMBED_BACKEND: local    below
#
# Free Postgres expires after 90 days; upgrade it before then or the data goes.

databases:
  - name: gita-counsel-db
    plan: free
    databaseName: gita_counsel
    user: gita_counsel

services:
  - type: web
    name: gita-counsel
    runtime: node
    plan: free
    healthCheckPath: /api/health

    # Migrations run here rather than in preDeployCommand, which the free plan
    # does not offer. `migrate deploy` is idempotent, so running it on every
    # build is safe.
    buildCommand: >-
      npm ci &&
      npx prisma generate --schema=prisma/postgres/schema.prisma &&
      npx prisma migrate deploy --schema=prisma/postgres/schema.prisma &&
      npm run build

    startCommand: npm start

    # Uncomment together with `plan: standard` above. Persistent disks are not
    # available on the free plan, and they disable zero-downtime deploys.
    # disk:
    #   name: model-cache
    #   mountPath: /var/data
    #   sizeGB: 5

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gita-counsel-db
          property: connectionString

      # Any random string is fine for session signing.
      - key: NEXTAUTH_SECRET
        generateValue: true

      # Must decode to exactly 32 bytes. Render's generator produces a random
      # string that would pass every check and then fail the moment a user
      # saves their first provider key, so set it yourself:
      #     openssl rand -base64 32
      # Changing it later makes every stored key undecryptable.
      - key: APP_ENCRYPTION_KEY
        sync: false

      # Your Render URL, e.g. https://gita-counsel.onrender.com
      # That origin + /api/auth/callback/google must be an authorised redirect
      # URI in the Google console, or sign-in fails with a mismatch.
      - key: NEXTAUTH_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # Who can reach /admin. Comma-separated. Without this, nobody can.
      - key: ADMIN_EMAILS
        sync: false

      - key: TRIAL_PROVIDER
        value: gemini
      - key: TRIAL_API_KEY
        sync: false
      - key: TRIAL_MESSAGE_LIMIT
        value: "10"
      - key: TRIAL_DAILY_CAP
        value: "200"

      # "disabled" on the free plan — see the note at the top.
      # Set to "local" once the instance has the memory for it.
      - key: EMBED_BACKEND
        value: disabled
      # Only read when EMBED_BACKEND is "local", and only useful with the disk.
      - key: EMBED_CACHE_DIR
        value: /var/data/transformers

      - key: NODE_VERSION
        value: "20"
